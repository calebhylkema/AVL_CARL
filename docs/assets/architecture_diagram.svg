<svg xmlns="http://www.w3.org/2000/svg" viewBox="90 10 1180 860" width="1180" height="860" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah-navy" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1e3a5f"/>
    </marker>
    <marker id="ah-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6d28d9"/>
    </marker>
    <marker id="ah-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c2410c"/>
    </marker>
    <marker id="ah-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#047857"/>
    </marker>
  </defs>

  <rect x="90" y="10" width="1180" height="860" fill="#ffffff"/>

  <!-- Title -->
  <text x="700" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#1e40af">System Architecture — Layered Drive-by-Wire</text>

  <!-- ================= AUTONOMY LAYER ================= -->
  <!-- Remote laptop -->
  <rect x="110" y="120" width="220" height="90" rx="8" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2"/>
  <text text-anchor="middle" font-size="16" fill="#374151">
    <tspan x="220" y="161" font-weight="700">Remote Laptop /</tspan>
    <tspan x="220" y="181">Operator Station</tspan>
  </text>

  <!-- Jetson -->
  <rect x="545" y="105" width="320" height="110" rx="8" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2"/>
  <text text-anchor="middle" fill="#374151">
    <tspan x="705" y="144" font-size="17" font-weight="700">NVIDIA Jetson Nano</tspan>
    <tspan x="705" y="165" font-size="15">Autonomy computer</tspan>
    <tspan x="705" y="185" font-size="15">perception · navigation · control</tspan>
  </text>

  <!-- Wi-Fi arrow -->
  <line x1="330" y1="163" x2="541" y2="160" stroke="#6d28d9" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah-purple)"/>
  <text x="437" y="150" text-anchor="middle" font-size="14" fill="#6d28d9">Wi-Fi  (teleop · monitor)</text>

  <!-- UART arrow -->
  <line x1="705" y1="217" x2="705" y2="297" stroke="#6d28d9" stroke-width="3" marker-end="url(#ah-purple)"/>
  <text x="714" y="263" font-size="15" fill="#6d28d9">UART serial</text>

  <!-- ================= MASTER LAYER ================= -->
  <rect x="545" y="300" width="320" height="115" rx="8" fill="#3b82f6" stroke="#1e3a5f" stroke-width="2"/>
  <text text-anchor="middle" fill="#ffffff">
    <tspan x="705" y="341" font-size="17" font-weight="700">STM32F767 Master / VCU</tspan>
    <tspan x="705" y="362" font-size="15">command arbitration</tspan>
    <tspan x="705" y="382" font-size="14">heartbeat 50 ms · watchdog · E-stop</tspan>
  </text>

  <!-- Safety callout -->
  <rect x="940" y="300" width="300" height="115" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2" stroke-dasharray="7 5"/>
  <text text-anchor="middle" fill="#b91c1c">
    <tspan x="1090" y="332" font-size="15" font-weight="700">Fail-safe &amp; Safety</tspan>
    <tspan x="1090" y="352" font-size="13">E-stop (highest priority 0x000)</tspan>
    <tspan x="1090" y="370" font-size="13">heartbeat watchdog on every node</tspan>
    <tspan x="1090" y="388" font-size="13">No brakes → command &amp; hold 0</tspan>
  </text>

  <!-- STM32 -> bus -->
  <line x1="705" y1="417" x2="705" y2="507" stroke="#1e3a5f" stroke-width="3" marker-end="url(#ah-navy)"/>

  <!-- ================= CAN BUS ================= -->
  <text x="210" y="500" font-size="16" font-weight="700" fill="#1e40af">CAN 2.0 bus  ·  500 kbit/s  ·  11-bit IDs  ·  120 Ω both ends</text>
  <line x1="200" y1="510" x2="1150" y2="510" stroke="#1e3a5f" stroke-width="5"/>

  <!-- bus drops -->
  <line x1="375" y1="512" x2="375" y2="583" stroke="#1e3a5f" stroke-width="2" marker-end="url(#ah-navy)"/>
  <line x1="800" y1="512" x2="800" y2="583" stroke="#1e3a5f" stroke-width="2" marker-end="url(#ah-navy)"/>
  <line x1="1095" y1="583" x2="1095" y2="514" stroke="#047857" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah-green)"/>

  <!-- ================= NODE LAYER ================= -->
  <!-- Throttle Teensy -->
  <rect x="230" y="585" width="290" height="95" rx="8" fill="#60a5fa" stroke="#1e3a5f" stroke-width="2"/>
  <text text-anchor="middle" fill="#0b2545">
    <tspan x="375" y="627" font-size="16" font-weight="700">Teensy 4.1 — Throttle / Drive</tspan>
    <tspan x="375" y="649" font-size="15">node ID 0x02</tspan>
  </text>

  <!-- Steering Teensy -->
  <rect x="655" y="585" width="290" height="95" rx="8" fill="#60a5fa" stroke="#1e3a5f" stroke-width="2"/>
  <text text-anchor="middle" fill="#0b2545">
    <tspan x="800" y="627" font-size="16" font-weight="700">Teensy 4.1 — Steering</tspan>
    <tspan x="800" y="649" font-size="15">node ID 0x03</tspan>
  </text>

  <!-- IMU -->
  <rect x="1010" y="585" width="180" height="95" rx="8" fill="#a7f3d0" stroke="#047857" stroke-width="2"/>
  <text text-anchor="middle" fill="#065f46">
    <tspan x="1100" y="616" font-size="16" font-weight="700">IMU</tspan>
    <tspan x="1100" y="636" font-size="14">accel + orientation</tspan>
    <tspan x="1100" y="655" font-size="14">over CAN</tspan>
  </text>

  <!-- ================= ACTUATOR / SENSOR LAYER ================= -->
  <!-- Motors -->
  <rect x="170" y="745" width="195" height="100" rx="8" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
  <text text-anchor="middle" fill="#9a3412">
    <tspan x="267" y="789" font-size="15" font-weight="700">4× BTS7960 H-bridge</tspan>
    <tspan x="267" y="810" font-size="14">→ 4 electric drive motors</tspan>
  </text>

  <!-- Encoders -->
  <rect x="385" y="745" width="180" height="100" rx="8" fill="#a7f3d0" stroke="#047857" stroke-width="2"/>
  <text text-anchor="middle" fill="#065f46">
    <tspan x="475" y="789" font-size="15" font-weight="700">Quadrature encoders</tspan>
    <tspan x="475" y="810" font-size="14">wheel speed · direction</tspan>
  </text>

  <!-- Steering actuator -->
  <rect x="600" y="745" width="195" height="100" rx="8" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
  <text text-anchor="middle" fill="#9a3412">
    <tspan x="697" y="789" font-size="15" font-weight="700">Steering actuator</tspan>
    <tspan x="697" y="810" font-size="14">step / dir / enable</tspan>
  </text>

  <!-- Limit switches -->
  <rect x="815" y="745" width="180" height="100" rx="8" fill="#a7f3d0" stroke="#047857" stroke-width="2"/>
  <text text-anchor="middle" fill="#065f46">
    <tspan x="905" y="789" font-size="15" font-weight="700">Position sensing</tspan>
    <tspan x="905" y="810" font-size="14">+ limit switches</tspan>
  </text>

  <!-- actuator/sensor arrows -->
  <line x1="322" y1="682" x2="272" y2="743" stroke="#c2410c" stroke-width="2" marker-end="url(#ah-orange)"/>
  <line x1="473" y1="743" x2="433" y2="683" stroke="#047857" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah-green)"/>
  <line x1="745" y1="682" x2="700" y2="743" stroke="#c2410c" stroke-width="2" marker-end="url(#ah-orange)"/>
  <line x1="903" y1="743" x2="853" y2="683" stroke="#047857" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah-green)"/>

  <!-- ================= LEGEND ================= -->
  <line x1="1010" y1="775" x2="1052" y2="775" stroke="#c2410c" stroke-width="2" marker-end="url(#ah-orange)"/>
  <text x="1062" y="780" font-size="13" fill="#64748b">command / actuation</text>
  <line x1="1010" y1="808" x2="1052" y2="808" stroke="#047857" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah-green)"/>
  <text x="1062" y="813" font-size="13" fill="#64748b">sensor feedback</text>
</svg>
