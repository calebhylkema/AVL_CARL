carl_bridge:
  ros__parameters:
    transport: serial   # serial | udp
    serial.port: /dev/ttyACM0
    serial.baud: 921600
    udp.remote_host: 192.168.1.10
    udp.remote_port: 5000
    udp.local_port: 5001
    poll_rate_hz: 200.0
    # P3022 analog OUT through a 10k/10k divider into steering Teensy 14/A0.
    steering.adc_reference_voltage: 3.3
    steering.divider_gain: 2.0
    steering.sensor_full_scale_voltage: 5.0
    steering.zero_offset_rad: 0.0
    steering.direction: 1.0
    steering.ratio: 1.0  # sensor radians per steering radian
    steering.calibrated: false
    steering.timeout_sec: 0.25
